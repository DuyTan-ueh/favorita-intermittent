# =============================================================================
# Cấu hình pipeline — mọi tham số thực nghiệm nằm ở đây, KHÔNG hard-code trong code
# Đổi thí nghiệm = copy file này, sửa, chạy với --config
# =============================================================================

run:
  name: "baseline_h7"
  seed: 42

data:
  # Mốc cắt: onpromotion trống 100% trước ngày này (đã kiểm chứng thực nghiệm)
  start_date: "2014-04-01"
  end_date: null            # null = lấy tới hết dữ liệu

  # Tiêu chí lọc chuỗi (đã khảo sát ở bước profiling)
  min_days_active: 365      # đủ lịch sử cho lag/rolling dài nhất
  min_positive_days: 50     # đủ mẫu dương để Stage 2 huấn luyện được
  require_active_until_end: 60   # còn bán trong N ngày cuối -> loại hàng đã ngừng KD

sampling:
  enabled: true
  n_series: 25000           # 133k chuỗi vượt RAM; lấy mẫu phân tầng
  stratify_by: "pattern"    # giữ nguyên tỷ lệ 4 nhóm Syntetos-Boylan

forecast:
  horizon: 7                # dự báo bao nhiêu ngày tới
  # RÀNG BUỘC: mọi lag phải >= horizon (validate tự động lúc load config)

features:
  lags: [7, 14, 21, 28]     # đều >= horizon
  rolling_windows: [7, 14, 28, 56]
  rolling_stats: ["mean", "std"]
  use_calendar: true
  use_promotion: true
  use_holidays: true
  use_static: true          # family / class / perishable / store type / cluster

split:
  # Rolling-origin backtesting — KHÔNG random split
  n_folds: 3
  test_days: 28             # mỗi fold test 28 ngày
  gap_days: 0               # khoảng đệm giữa train và test
  # Sinh thêm định nghĩa fold cho từng giá trị gap để so sánh ở bước huấn
  # luyện. gap=0 giả định huấn luyện lại mỗi ngày; gap=horizon mô phỏng huấn
  # luyện một lần rồi dự báo cả chu kỳ mà không cập nhật.
  gap_variants: [0, 7]

experiment:
  # Số cây của XGBoost. Giảm xuống rút ngắn thời gian chạy đáng kể mà vẫn giữ
  # được tính công bằng khi so sánh, vì mọi mô hình đều dùng cùng một giá trị.
  # 300 cho kết quả tốt nhất nhưng cả hai giá trị gap mất khoảng 15 giờ, vượt
  # giới hạn phiên làm việc của Kaggle. 200 là mức cân bằng hợp lý.
  n_estimators: 200

  # Thiết bị tính toán: "auto" tự dò GPU và lùi về CPU nếu không có.
  # GPU rút ngắn thời gian huấn luyện rất nhiều với dữ liệu quy mô này.
  device: auto

  # Hàm mất mát cho giai đoạn hai của khung Two-Stage.
  # Giai đoạn hai chỉ học trên nhu cầu dương nên phân phối mục tiêu bị chặn
  # dưới và lệch phải; sai số bình phương giả định sai số đối xứng nên không
  # phù hợp. Liệt kê nhiều giá trị để so sánh trong cùng một lần chạy.
  #   squared      - mốc so sánh, cấu hình ban đầu
  #   gamma        - liên tục dương lệch phải, chuẩn trong tài liệu hurdle
  #   poisson      - phân phối đếm
  #   absolute     - khớp với WAPE vốn dựa trên sai số tuyệt đối
  #   log_squared  - biến đổi log rồi dùng sai số bình phương
  stage2_objectives: [squared, gamma, absolute]

  # Mô hình hoá phần dư y-1 thay vì y, vì nhu cầu dương nhỏ nhất là 1.
  stage2_shift: false

  # Bộ đặc trưng đưa vào nghiên cứu loại trừ, xếp chồng dần từng nhóm một.
  # Bỏ bớt phần tử ở đây để rút ngắn thời gian nếu cần.
  feature_sets:
    - historical
    - hist_calendar
    - hist_cal_holiday
    - hist_cal_hol_promo
    - full

  # Ghi kết quả sau mỗi fold. Nếu phiên làm việc bị ngắt giữa chừng, lần chạy
  # sau sẽ bỏ qua những fold đã xong thay vì làm lại từ đầu.
  checkpoint: true

  # Lưu sai số theo từng chuỗi để chạy kiểm định thống kê về sau.
  save_series_losses: true

output:
  dir: "artifacts"
  format: "parquet"
  batch_size: 5000          # số chuỗi xử lý mỗi lô, kiểm soát bộ nhớ
